# Stateful services for local dev. API (php artisan serve) + Next apps run on host
# against the exposed ports. App containers come later if we deploy via Docker.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pig_farm
      POSTGRES_USER: pig_farm
      POSTGRES_PASSWORD: pig_farm
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pig_farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
